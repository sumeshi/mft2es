[project]
name = "mft2es"
dynamic = ["version"]
description = "A library for fast import of Windows Master File Table($MFT) into Elasticsearch."
readme = "README.md"
license = "MIT"
authors = [
    { name = "sumeshi", email = "sum3sh1@protonmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "elasticsearch==9.5.1",
    "orjson==3.13.0",
    "tqdm>=4.70.1",
    "urllib3>=2.8.0",
    "mft>=0.7.0",
]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/mft2es/__about__.py"

[dependency-groups]
dev = [
    "black==26.10.1",
    "flake8>=7.4.1",
    "mypy==2.4.0",
    "nuitka[onefile]==4.3",
    "pytest==9.1.1",
]

[project.scripts]
mft2es = 'mft2es.views.Mft2esView:entry_point'
mft2json = 'mft2es.views.Mft2jsonView:entry_point'
